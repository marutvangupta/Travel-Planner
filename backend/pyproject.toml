[project]
name = "travel-planner"
version = "0.1.0"
description = "AI travel agent: personalized itineraries that re-plan when conditions change"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "redis>=5.0",
  "langgraph>=0.2",
  "openai>=1.40",
  "mcp>=1.2,<2",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "email-validator>=2.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
langfuse = ["langfuse>=3", "langchain>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." lets tests import the evals package

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
