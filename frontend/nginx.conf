server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and the SSE stream. Buffering must be off or the progress events arrive all at once.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # index.html names the hashed bundles, so always revalidate it: a rebuilt image is picked up on the next visit
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
