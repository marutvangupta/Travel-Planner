<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Waypoint</title>
    <meta name="description" content="An AI travel planner that builds your itinerary from real places, then re-plans the parts that change." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ebf0ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061519" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem("wp-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
