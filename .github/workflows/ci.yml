name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: tp, POSTGRES_PASSWORD: tp, POSTGRES_DB: tp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tp" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - name: Tests on SQLite (includes the smoke eval gate)
        run: pytest -q
      - name: Tests on PostgreSQL + pgvector
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tp:tp@localhost:5432/tp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
